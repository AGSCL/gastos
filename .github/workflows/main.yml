name: Actualiza_gastos
on:
  push:
  schedule:
    - cron: '0 0 * * MON'

jobs: 
  build:
    runs-on: windows-latest
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SUPERSECRET: ${{ secrets.SUPERSECRET }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup .Renviron
        run: |
          echo "SUPERSECRET=$SUPERSECRET" >> ~/.Renviron
      - name: Set locale
        shell: bash
        if: always()
        run: |
          Rscript -e 'Sys.setlocale("LC_TIME", "Spanish_Chile.1252")'
          Rscript -e 'Sys.setlocale("LC_COLLATE", "Spanish_Chile.1252")'

      # Instala solo lo que usa sitio2.Rmd y guarda los paquetes en caché entre corridas
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::tidyverse
            any::plyr
            any::reshape2
            any::scales
            any::plotly
            any::forecast
            any::tsibble
            any::ggiraph
            any::gplots
            any::Hmisc
            any::tm
            any::wordcloud
            any::RColorBrewer
            any::tidytext
            any::rvest
            any::janitor
            any::DT
            any::sessioninfo

      # Caché de knitr: el modelo de presupuesto solo se recalcula cuando cambia la serie mensual
      - name: Cache knitr
        uses: actions/cache@v4
        with:
          path: sitio2_cache
          key: knitr-${{ runner.os }}-${{ github.run_id }}
          restore-keys: knitr-${{ runner.os }}-

      - name: Render RMarkdown
        if: always()
        run: Rscript -e 'rmarkdown::render("sitio2.Rmd")'
        
      - name: Commit and Push
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Actualización automática $(date +'%Y-%m-%d %H:%M')" || echo "No hay cambios para commitear"
          git push origin
